# Sync-Receipts configuration
# Edit the values below, then save this file.
# Lines starting with # are comments and are ignored.

# Path to the folder where your receipt subfolders live (required)
# Example: C:\Users\YourName\Documents\Receipts
# Example: \\Server\Share\Receipts
RECEIPTS_ROOT=C:\Users\YOUR-USERNAME\Documents\Receipts

# Local drive path to RECEIPTS_ROOT, used by VS Code tasks to avoid network slowness.
# Leave blank to use RECEIPTS_ROOT as-is.
RECEIPTS_ROOT_LOCAL=

# Folder where per-year workbooks (e.g. 2026.xlsx) are saved.
# Leave blank to save workbooks in the same folder as your receipts.
WORKBOOKS_ROOT=

# Date format used in receipt filenames (default: yyMMdd, e.g. 260316 for March 16 2026).
# Change only if your receipt files use a different date format.
DATE_FORMAT=yyMMdd

name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pester:
    name: Pester + PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run tests
        shell: pwsh
        run: Invoke-Pester tests/ -Output Detailed -CI

name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pester:
    name: Pester + PSScriptAnalyzer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path             = 'Tests/'
          $cfg.Output.Verbosity     = 'Detailed'
          $cfg.Run.PassThru         = $true
          $cfg.CodeCoverage.Enabled = $true
          $cfg.CodeCoverage.Path    = 'Scripts/Sync-Receipts.ps1'
          $result = Invoke-Pester -Configuration $cfg
          if ($result.FailedCount -gt 0) { exit 1 }
          $cc = $result.CodeCoverage
          if ($cc.NumberOfCommandsAnalyzed -gt 0) {
            $pct = [math]::Round(($cc.NumberOfCommandsExecuted / $cc.NumberOfCommandsAnalyzed) * 100, 1)
            Write-Host "Coverage: $pct% ($($cc.NumberOfCommandsExecuted)/$($cc.NumberOfCommandsAnalyzed) commands) -- Scripts/Sync-Receipts.ps1"
          }

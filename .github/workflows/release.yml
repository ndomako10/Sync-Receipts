name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Extract version from tag
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"     >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate changelog entry exists for tag
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          FOUND=$(grep -c "^## \[$VERSION\]" CHANGELOG.md || true)
          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: No CHANGELOG.md entry found for [$VERSION]."
            echo "Add a ## [$VERSION] section to CHANGELOG.md before tagging."
            exit 1
          fi
          echo "Changelog entry OK: [$VERSION]"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          notes=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^---$/{exit} found{print}" CHANGELOG.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2.6.1 (node20 -- update when node24 release available)
        with:
          body: ${{ steps.notes.outputs.content }}

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.
Format follows [Keep a Changelog](https://keepachangelog.com/en/1.0.0/).
This project uses [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

---"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {{ commit.description | upper_first }}
{% endfor %}\
{% endfor %}
---

"""

footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_parsers = [
    { type = "feat", group = "Added" },
    { type = "fix", group = "Fixed" },
    { type = "refactor", group = "Changed" },
    { type = "perf", group = "Changed" },
    { type = "docs", group = "Documentation" },
    { type = "test", group = "Tests" },
    { type = "chore", group = "Maintenance" },
    { type = "ci", group = "Maintenance" },
    { type = "build", group = "Maintenance" },
    { type = "style", group = "Maintenance" },
    { message = "^.*", skip = true },
]

filter_commits = true
tag_pattern = "v[0-9]*"
ignore_tags = "v0\\."
sort_commits = "oldest"
